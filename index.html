<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>Speak Up — treino de inglês com voz e escrita</title>
  <meta name="description" content="Estudo próprio de inglês: chat de voz com correção de erros, chat escrito, treinos de pronúncia e acompanhamento de evolução." />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Speak Up" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>🎧 Speak Up</strong>
      <span>inglês progressivo — Guilherme</span>
    </div>
    <div class="hud">
      <span class="chip level" id="hud-level">A1</span>
      <div class="xp-wrap">
        <div class="xp-bar"><i id="hud-xp-fill"></i></div>
        <div class="xp-text" id="hud-xp-text">0 XP</div>
      </div>
      <span class="chip" id="hud-streak" title="Dias seguidos de estudo">🔥 0</span>
      <span class="chip" id="hud-due" title="Correções para revisar hoje">🧠 0</span>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view" role="main"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
